spring.application.name=incident-manager
server.port=8080

# ---- Base de donnees H2 (en memoire) : par defaut ----
spring.datasource.url=jdbc:h2:mem:incidentsdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---- JWT ----
# Cle secrete en Base64 (>= 256 bits). A CHANGER en production !
app.jwt.secret=eN94yiV1hJedJE8ZQBO8JhxqMLYdrPDzzbWSmgtbvdO/Bv6oxgemWTkt0F28vBaq
# Duree de vie de l'access token : 5 minutes (300000 ms)
app.jwt.expiration-ms=300000
# Duree de vie du refresh token : 7 jours
app.jwt.refresh-expiration-ms=604800000

# ---- CORS : origine du frontend React (Vite) ----
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173

# ---- Comptes de test crees au demarrage (si la base est vide) ----
app.seed.enabled=true
